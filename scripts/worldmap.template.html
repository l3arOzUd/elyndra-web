<title>ELYNDRA World Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a surveyor's chart. The atlas fills the width; the selected map's
     ledger sits beside it on desktop and below it on phones. */
  :root {
    --bg: #e7ecea;        /* stone */
    --paper: #f7f9f8;
    --ink: #1b2730;
    --muted: #586a73;
    --line: #c3cfcd;
    --line-strong: #8fa2a3;
    --accent: #0d7f83;    /* Aetherite */
    --brass: #9a6d1f;
    --deep: #233039;      /* dungeon cards */
    --on-deep: #e8f0f1;
    --good: #2f7d4a;
    --warn: #a85a12;
    --region-wash: 0.13;
    --f-display: "Alegreya SC", "Palatino Linotype", Georgia, serif;
    --f-body: "IBM Plex Sans Thai", "Leelawadee UI", "Tahoma", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f171c; --paper: #16222a; --ink: #e2ebed; --muted: #8fa2aa; --line: #283842; --line-strong: #4b6170;
      --accent: #48c6c6; --brass: #d3a44b; --deep: #0a1015; --on-deep: #dbe7ea; --good: #6fc48b; --warn: #e3a05a; --region-wash: 0.16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f171c; --paper: #16222a; --ink: #e2ebed; --muted: #8fa2aa; --line: #283842; --line-strong: #4b6170;
    --accent: #48c6c6; --brass: #d3a44b; --deep: #0a1015; --on-deep: #dbe7ea; --good: #6fc48b; --warn: #e3a05a; --region-wash: 0.16;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: grid; gap: 20px; max-width: 1500px; margin: 0 auto; }
  header { display: grid; gap: 4px; }
  h1 { font: 700 clamp(26px, 4vw, 38px)/1.1 var(--f-display); letter-spacing: 0.04em; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0; }
  .sub b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; align-items: center; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .k-walk { width: 26px; border-top: 2px solid var(--line-strong); }
  .k-transit { width: 26px; border-top: 2px dashed var(--brass); }
  .k-town { width: 12px; height: 12px; border: 2px solid var(--brass); background: var(--paper); border-radius: 3px; }
  .k-dun { width: 12px; height: 12px; background: var(--deep); border-radius: 3px; }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  @media (max-width: 980px) { .stage { grid-template-columns: minmax(0, 1fr); } }
  .chart { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: auto; min-width: 0; max-height: 78vh; overscroll-behavior: contain; }
  .chart svg { display: block; max-width: none; }
  .node { cursor: pointer; }
  .node:focus { outline: none; }
  .node:focus-visible .card, .node.sel .card { stroke: var(--accent); stroke-width: 3; }
  .node:hover .card { stroke: var(--accent); }
  .r-label { font: 700 26px var(--f-display); letter-spacing: 0.06em; fill: var(--ink); }
  .r-meta { font: 500 15px var(--f-mono); fill: var(--muted); }
  .n-name { font: 700 17px var(--f-display); letter-spacing: 0.02em; fill: var(--ink); }
  .n-meta { font: 500 13px var(--f-mono); fill: var(--muted); }
  .dun .n-name { fill: var(--on-deep); }
  .dun .n-meta { fill: var(--on-deep); opacity: 0.75; }
  .t-cost { font: 500 14px var(--f-mono); fill: var(--brass); }

  aside.ledger { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0; }
  .eyebrow { font: 500 12px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ledger h2 { font: 700 26px/1.15 var(--f-display); margin: 2px 0 0; letter-spacing: 0.03em; }
  .role { margin: 0; color: var(--muted); font-size: 14px; }
  .ledger h3 { font: 600 13px var(--f-body); color: var(--muted); margin: 0 0 6px; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.num { text-align: right; font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; padding-left: 8px; }
  .chip { display: inline-block; font: 500 11px var(--f-mono); padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; margin-left: 6px; white-space: nowrap; }
  .ok { color: var(--good); }
  .no { color: var(--warn); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 13px; padding: 2px 9px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
  ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  button.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  button.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  .index { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .index section { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .index h2 { font: 700 19px var(--f-display); margin: 0; letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px; }
  .index h2 span.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .index p { margin: 2px 0 8px; color: var(--muted); font-size: 13px; font-family: var(--f-mono); }
  .index li { display: flex; justify-content: space-between; gap: 8px; }
  .index li span { font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
  footer { color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: no-preference) { .node .card { transition: stroke 0.15s; } }
</style>

<div class="wrap">
  <header>
    <h1>ELYNDRA World Atlas</h1>
    <p class="sub" id="sub"></p>
    <div class="legend">
      <span><i class="k-walk"></i>เดินข้ามแผนที่ (warp)</span>
      <span><i class="k-transit"></i>ส่งตัวระหว่างเมือง (ค่าเดินทาง zeny)</span>
      <span><i class="k-town"></i>เมือง</span>
      <span><i class="k-dun"></i>ดันเจี้ยน</span>
      <span>กดที่แผนที่เพื่อดูมอน NPC เควสต์ และทางออก</span>
    </div>
  </header>

  <p class="sub">เลื่อนดูแผนที่ในกรอบได้ทั้งแนวตั้งและแนวนอน ลำดับภูมิภาคเรียงตามเส้นทางส่งตัว (Lumeris → Nocthaven)</p>
  <div class="stage">
    <div class="chart" id="chart" aria-label="แผนที่โลก ELYNDRA"></div>
    <aside class="ledger" id="ledger" aria-live="polite"></aside>
  </div>

  <div class="index" id="index"></div>
  <footer id="foot"></footer>
</div>

<script>
const WORLD = /*__WORLD__*/null;
const SVGNS = "http://www.w3.org/2000/svg";
const CW = 196, CH = 104, NW = 168, NH = 64, PAD = 64;
const byId = new Map(WORLD.maps.map((m) => [m.id, m]));
const region = new Map(WORLD.regions.map((r) => [r.id, r]));
const TYPE_TH = { town: "เมือง", field: "ทุ่ง", dungeon: "ดันเจี้ยน" };
const AI_TH = { passive: "สงบ", assist: "ช่วยพวก", aggressive: "ดุ", flee: "หนี" };
const KIND_TH = { swarm: "ฝูง", bruiser: "ตัวหนา", ranged: "ระยะไกล", construct: "กลไก", support: "ซัพพอร์ต", elite: "elite", boss: "บอส" };

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.append(e);
  return e;
}
const cx = (m) => PAD + m.x * CW + CW / 2;
const cy = (m) => PAD + m.y * CH + CH / 2;

function draw() {
  const maxX = Math.max(...WORLD.maps.map((m) => m.x)) + 1, maxY = Math.max(...WORLD.maps.map((m) => m.y)) + 1;
  // Drawn at its natural size (readable type); the chart box scrolls.
  const W = PAD * 2 + maxX * CW, H = PAD * 2 + maxY * CH;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img" });
  // Region grounds and labels.
  for (const r of WORLD.regions) {
    const [x0, y0, x1, y1] = r.box;
    const g = el("g", {}, svg);
    el("rect", { x: PAD + x0 * CW + 4, y: PAD + y0 * CH - 34, width: (x1 - x0 + 1) * CW - 8, height: (y1 - y0 + 1) * CH + 30, rx: 14,
      fill: r.color, "fill-opacity": getComputedStyle(document.documentElement).getPropertyValue("--region-wash").trim() || 0.13 }, g);
    const t = el("text", { x: PAD + x0 * CW + 18, y: PAD + y0 * CH - 10, class: "r-label" }, g);
    t.textContent = r.name;
    const meta = el("text", { x: PAD + x0 * CW + 18 + r.name.length * 17 + 12, y: PAD + y0 * CH - 10, class: "r-meta" }, g);
    meta.textContent = `Lv ${r.lv[0]}–${r.lv[1]} · ${r.capital}`;
  }
  // Walking links, then transit, under the cards.
  for (const [a, b] of WORLD.walks) {
    const A = byId.get(a), B = byId.get(b);
    el("line", { x1: cx(A), y1: cy(A), x2: cx(B), y2: cy(B), stroke: "var(--line-strong)", "stroke-width": 3 }, svg);
  }
  // Transit runs region to region, edge to edge, so it never crosses the fields.
  const rect = (rid) => { const [x0, y0, x1, y1] = region.get(rid).box; return { l: PAD + x0 * CW + 4, r: PAD + (x1 + 1) * CW - 4, t: PAD + y0 * CH - 34, b: PAD + (y1 + 1) * CH - 4 }; };
  for (const [a, b, cost] of WORLD.transit) {
    const A = byId.get(a), B = byId.get(b), ra = rect(A.region), rb = rect(B.region);
    let x1, y1, x2, y2;
    if (rb.l >= ra.r) { x1 = ra.r; x2 = rb.l; y1 = y2 = (Math.max(ra.t, rb.t) + Math.min(ra.b, rb.b)) / 2; }
    else if (ra.l >= rb.r) { x1 = ra.l; x2 = rb.r; y1 = y2 = (Math.max(ra.t, rb.t) + Math.min(ra.b, rb.b)) / 2; }
    else { x1 = x2 = (Math.max(ra.l, rb.l) + Math.min(ra.r, rb.r)) / 2; y1 = ra.b < rb.t ? ra.b : ra.t; y2 = ra.b < rb.t ? rb.t : rb.b; }
    el("line", { x1, y1, x2, y2, stroke: "var(--brass)", "stroke-width": 2.5, "stroke-dasharray": "8 7" }, svg);
    for (const [x, y] of [[x1, y1], [x2, y2]]) el("circle", { cx: x, cy: y, r: 4, fill: "var(--brass)" }, svg);
    const horizontal = y1 === y2;
    const t = el("text", { x: (x1 + x2) / 2 + (horizontal ? 0 : 10), y: (y1 + y2) / 2 + (horizontal ? -10 : 5), "text-anchor": horizontal ? "middle" : "start", class: "t-cost" }, svg);
    t.textContent = `${A.name} ⇄ ${B.name} · ${cost}z`;
  }
  // Map cards.
  for (const m of WORLD.maps) {
    const g = el("g", { class: `node ${m.type === "dungeon" ? "dun" : ""}`, tabindex: 0, role: "button", "data-id": m.id, "aria-label": `${m.name}` }, svg);
    const x = cx(m) - NW / 2, y = cy(m) - NH / 2;
    el("rect", { class: "card", x, y, width: NW, height: NH, rx: 8, fill: m.type === "dungeon" ? "var(--deep)" : "var(--paper)",
      stroke: m.type === "town" ? "var(--brass)" : "var(--line-strong)", "stroke-width": m.type === "town" ? 2.5 : 1.5 }, g);
    el("rect", { x, y, width: 6, height: NH, rx: 3, fill: region.get(m.region).color }, g);
    const name = el("text", { x: x + 16, y: y + 26, class: "n-name" }, g);
    name.textContent = m.name;
    if (m.name.length > 15) name.setAttribute("style", "font-size:14px"); // long names stay inside the card
    const meta = el("text", { x: x + 16, y: y + 48, class: "n-meta" }, g);
    const art = m.monsters.length ? ` · ภาพ ${m.monsters.filter((s) => s.art).length}/${m.monsters.length}` : "";
    meta.textContent = m.type === "town" ? "เมือง" : `Lv ${m.lv[0]}–${m.lv[1]}${art}`;
    g.addEventListener("click", () => select(m.id));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(m.id); } });
  }
  document.getElementById("chart").append(svg);
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function select(id) {
  const m = byId.get(id);
  const r = region.get(m.region);
  document.querySelectorAll(".node").forEach((n) => n.classList.toggle("sel", n.dataset.id === id));
  const mons = m.monsters.length
    ? `<table>${m.monsters.map((s) => `<tr><td>${esc(s.name)}<span class="chip ${s.art ? "ok" : "no"}">${s.art ? "มีภาพ" : "ยังไม่มีภาพ"}</span><br><span class="role">${KIND_TH[s.kind] ?? s.kind} · ${AI_TH[s.ai] ?? s.ai}</span></td><td class="num">Lv ${s.lv}<br>×${s.n}</td></tr>`).join("")}</table>`
    : `<p class="empty">ไม่มีมอนในแผนที่นี้</p>`;
  const exits = m.exits.map((x) => `<li>${x.edge} → <button class="link" data-go="${x.to}">${esc(x.name)}</button>${x.needs ? ` <span class="chip no">ต้องมีบัตรผ่าน</span>` : ""}</li>`).join("");
  document.getElementById("ledger").innerHTML = `
    <div><div class="eyebrow">${esc(r.name)} · ${TYPE_TH[m.type]} · <span style="font-family:var(--f-mono)">${m.id}</span></div>
    <h2>${esc(m.name)}</h2>
    <div class="eyebrow">${m.type === "town" ? `เมืองหลวงของ ${esc(r.name)}` : `แนะนำ Lv ${m.lv[0]}–${m.lv[1]}`}</div></div>
    <p class="role">${esc(m.role)}</p>
    <div><h3>มอนสเตอร์${m.monsters.length ? ` (รวม ${m.monsters.reduce((a, s) => a + s.n, 0)} ตัว)` : ""}</h3>${mons}</div>
    <div><h3>NPC</h3><div class="tags">${m.npcs.map((n) => `<span class="tag">${esc(n)}</span>`).join("") || `<span class="empty">—</span>`}</div></div>
    <div><h3>เควสต์ที่รับได้ที่นี่</h3>${m.quests.length ? `<ul class="plain">${m.quests.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` : `<p class="empty">—</p>`}</div>
    <div><h3>ทางออก</h3><ul class="plain">${exits}</ul></div>`;
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); scrollToNode(b.dataset.go); }));
}

function scrollToNode(id) {
  const n = document.querySelector(`.node[data-id="${id}"]`);
  if (n) n.scrollIntoView({ block: "nearest", inline: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function index() {
  const box = document.getElementById("index");
  for (const r of WORLD.regions) {
    const ms = WORLD.maps.filter((m) => m.region === r.id);
    const species = ms.reduce((a, m) => a + m.monsters.length, 0), art = ms.reduce((a, m) => a + m.monsters.filter((s) => s.art).length, 0);
    const s = document.createElement("section");
    s.innerHTML = `<h2><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</h2>
      <p>Lv ${r.lv[0]}–${r.lv[1]} · ${ms.length} แผนที่ · มอน ${species} ชนิด · มีภาพ ${art}</p>
      <ul class="plain">${ms.map((m) => `<li><button class="link" data-go="${m.id}">${esc(m.name)}</button><span>${m.type === "town" ? "เมือง" : `Lv ${m.lv[0]}–${m.lv[1]}`}</span></li>`).join("")}</ul>`;
    box.append(s);
  }
  box.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { select(b.dataset.go); document.getElementById("ledger").scrollIntoView({ block: "nearest" }); }));
}

const total = WORLD.maps.length, towns = WORLD.maps.filter((m) => m.type === "town").length, dun = WORLD.maps.filter((m) => m.type === "dungeon").length;
const allSpecies = WORLD.maps.reduce((a, m) => a + m.monsters.length, 0);
const withArt = WORLD.maps.reduce((a, m) => a + m.monsters.filter((s) => s.art).length, 0);
document.getElementById("sub").innerHTML = `<b>${WORLD.regions.length}</b> ภูมิภาค · <b>${total}</b> แผนที่ (เมือง ${towns} · ทุ่ง ${total - towns - dun} · ดันเจี้ยน ${dun}) · มอน <b>${allSpecies}</b> ชนิด มีภาพแล้ว <b>${withArt}</b> · Lv 1–99`;
document.getElementById("foot").textContent = `สร้างจากข้อมูลเกม (elyndra-web/public/data) เมื่อ ${WORLD.generated} ด้วย npm run worldmap · ตำแหน่งแผนที่จัดตามทิศของ warp จริง ไม่ใช่ระยะทางจริง`;
draw();
index();
select(WORLD.maps[0].id);
</script>
