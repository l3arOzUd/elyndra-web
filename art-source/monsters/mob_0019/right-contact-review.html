<!doctype html><meta charset="utf-8"><title>Sun Warden right contact study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style>
<h1>Sun Warden: right-facing opposite contact</h1>
<p>Inspect the visible hip attachment: near thigh must trail left while the far leg steps right. Study only, not a complete walk.</p>
<select id="pose"><option value="0">Original near-forward contact</option><option value="2">Guide-primary opposite contact candidate</option><option value="1">First guide attempt — wrong leg</option></select>
<button id="play">Alternate / pause</button><br>
<canvas width="640" height="640"></canvas>
<script type="module">
const images=await Promise.all(['walk-right.png','walk-right-contact-b.png','walk-right-contact-b-v2.png'].map(async f=>{const im=new Image();im.src=f;await im.decode();return im}));
const g=document.querySelector('canvas').getContext('2d'),pose=document.querySelector('#pose');
let playing=false,last=0;
function draw(){
 g.clearRect(0,0,640,640);
 if(pose.value==='0')g.drawImage(images[0],0,0,768,512,320-460*.9,590-500*.9,768*.9,512*.9);
 else {const index=Number(pose.value),im=images[index],s=.39;g.drawImage(im,320-630*s,590-(index===2?1205:1180)*s,im.width*s,im.height*s)}
 g.strokeStyle='#b1babe';g.beginPath();g.moveTo(10,590);g.lineTo(630,590);g.stroke();
}
pose.onchange=()=>{playing=false;draw()};
document.querySelector('#play').onclick=()=>{playing=!playing;last=performance.now()};
function tick(t){if(playing&&t-last>500){pose.value=pose.value==='0'?'2':'0';last=t;draw()}requestAnimationFrame(tick)}
draw();requestAnimationFrame(tick);window.__wardenRightContact={ready:true};
</script>
