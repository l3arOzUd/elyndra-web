<!doctype html><meta charset="utf-8">
<title>Sun Warden right walk study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style>
<h1>Sun Warden right walk — draft</h1>
<p>Inspect alternating support, low boot clearance and rigid halo continuity. Opposite leg identity remains under review. Not gameplay approved.</p>
<button id="play">Play / pause</button>
<select id="source"><option value="walk-right.png">Original study — repeated leading leg</option><option value="walk-right-v2.png">Revision — high knee, unresolved contact</option></select>
<input id="frame" type="range" min="0" max="3" value="0"><span id="label"></span><br>
<canvas width="640" height="640"></canvas>
<script type="module">
const im=new Image();im.src='walk-right.png';await im.decode();
document.querySelector('#source').onchange=async e=>{playing=false;im.src=e.target.value;await im.decode();draw()};
const g=document.querySelector('canvas').getContext('2d'),slider=document.querySelector('#frame');
const order=[0,1,2,3],anchors=[460,1090,460,1090],ground=[500,500,1000,1000];
const names=['contact A','passing A','opposite contact candidate','opposite passing candidate'];
let playing=false,last=0;
function draw(){
 const f=Number(slider.value),cell=order[f],x=cell%2*768,y=Math.floor(cell/2)*512,s=.9;
 g.clearRect(0,0,640,640);g.drawImage(im,x,y,768,512,320+(x-anchors[cell])*s,590+(y-ground[cell])*s,768*s,512*s);
 g.strokeStyle='#b1babe';g.beginPath();g.moveTo(10,590);g.lineTo(630,590);g.stroke();
 document.querySelector('#label').textContent=names[f];
}
slider.oninput=()=>{playing=false;draw()};
document.querySelector('#play').onclick=()=>{playing=!playing;last=performance.now()};
function tick(t){if(playing&&t-last>300){slider.value=String((Number(slider.value)+1)%4);last=t;draw()}requestAnimationFrame(tick)}
draw();requestAnimationFrame(tick);window.__wardenRightWalk={ready:true,order};
</script>
