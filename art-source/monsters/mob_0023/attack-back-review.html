<!doctype html><meta charset="utf-8"><title>Relay Guardian rear attack study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}button,input{margin:12px}a{color:#acf}</style>
<h1>Relay Guardian: rear sonar attack study</h1>
<p>Three drawings, six timing frames. Charge and release draft; neutral temporarily substitutes for recovery. Stance width differs from front view; dish scale, hoses and armor continuity need cleanup. Not runtime-bound.</p>
<button id="replay">Replay</button><input id="frame" type="range" min="0" max="5" value="0"><span id="label"></span><br><canvas id="preview" width="512" height="512"></canvas><canvas id="small" width="128" height="128"></canvas>
<p><a href="index.html">References</a> | <a href="idle-front-review.html">Idle</a> | <a href="/">Game</a></p>
<script type="module">
const files=['back-neutral-v2.png','attack-back-charge.png','attack-back-release.png'];
const urls=import.meta.glob('./{back-neutral-v2,attack-back-charge,attack-back-release}.png',{eager:true,query:'?url',import:'default'});
const art=await Promise.all(files.map(src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=urls[`./${src}`]})));
const sequence=[0,1,1,2,2,0],g=preview.getContext('2d'),s=small.getContext('2d');let timer;
function draw(f){clearTimeout(timer);frame.value=f;label.textContent=`Frame ${f+1}: ${['neutral / temporary recovery','charge','release'][sequence[f]]}`;g.clearRect(0,0,512,512);g.drawImage(art[sequence[f]],0,0,512,512);s.clearRect(0,0,128,128);s.drawImage(preview,0,0,128,128)}
function play(f=0){draw(f);if(f<5)timer=setTimeout(()=>play(f+1),160)}
replay.onclick=()=>play();frame.oninput=()=>draw(Number(frame.value));draw(0);window.__relayRearAttack={ready:true,draw,sequence};
</script>
