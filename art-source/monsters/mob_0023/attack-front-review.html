<!doctype html><meta charset="utf-8"><title>Relay Guardian sonar attack study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}button,input{margin:12px}a{color:#acf}</style>
<h1>Relay Guardian: front sonar attack study</h1>
<p>Four drawings, six timing frames. Sonar charge/release draft. Dedicated recovery added; separate sonar pulse preview added (not connected to combat); stance width, armor and hoses drift. Not runtime-bound.</p>
<label><input id="sonar" type="checkbox" checked>Sonar VFX study</label><br><button id="replay">Replay</button><input id="frame" type="range" min="0" max="5" value="0"><span id="label"></span><br><canvas id="preview" width="512" height="512"></canvas><canvas id="small" width="128" height="128"></canvas>
<p><a href="index.html">References</a> | <a href="idle-front-review.html">Idle</a> | <a href="/">Game</a></p>
<script type="module">
const files=['front-neutral-v2.png','attack-front-charge.png','attack-front-release.png','attack-front-recovery.png'];
const urls=import.meta.glob('./{front-neutral-v2,attack-front-charge,attack-front-release,attack-front-recovery}.png',{eager:true,query:'?url',import:'default'});
const art=await Promise.all(files.map(src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=urls[`./${src}`]})));
const sequence=[0,1,1,2,3,0],g=preview.getContext('2d'),s=small.getContext('2d');
let raf=0,currentMs=0;
const emissionMs=480,endMs=1200;
function pulse(age){
 if(age<0||age>600||!sonar.checked)return;
 g.save();g.globalCompositeOperation='screen';
 for(let ring=0;ring<3;ring++){
  const t=(age-ring*65)/430;if(t<0||t>1)continue;
  const radius=12+120*t;
  g.globalAlpha=Math.sin(Math.PI*t)*(1-t)*.85;
  g.strokeStyle='#4ee5ef';g.lineWidth=4*(1-t)+1;g.shadowColor='#2db6c7';g.shadowBlur=8;
  g.beginPath();g.arc(256,104,radius,0,Math.PI*2);g.stroke();
  g.globalAlpha*=.65;g.lineWidth=1;g.strokeStyle='#e3ffff';g.stroke();
 }
 g.restore();
}
function render(ms){
 currentMs=ms;const f=Math.min(5,Math.floor(ms/160));frame.value=f;
 label.textContent='Frame '+(f+1)+': '+['neutral','charge','release','recovery'][sequence[f]]+' ? '+Math.round(ms)+' ms';
 g.clearRect(0,0,512,512);g.drawImage(art[sequence[f]],0,0,512,512);pulse(ms-emissionMs);
 s.clearRect(0,0,128,128);s.drawImage(preview,0,0,128,128);
}
function draw(f){cancelAnimationFrame(raf);render(f*160)}
function drawTime(ms){cancelAnimationFrame(raf);render(ms)}
function play(){cancelAnimationFrame(raf);const start=performance.now();function tick(now){const ms=Math.min(endMs,now-start);render(ms);if(ms<endMs)raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}
replay.onclick=play;frame.oninput=()=>draw(Number(frame.value));sonar.onchange=()=>render(currentMs);
draw(0);window.__relayFrontAttack={ready:true,draw,drawTime,sequence,emissionMs,endMs};
</script>
