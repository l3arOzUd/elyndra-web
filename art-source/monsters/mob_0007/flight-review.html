<!doctype html>
<meta charset="utf-8">
<title>Dustwing flight review</title>
<style>body{background:#253039;color:#eee;font:16px system-ui;margin:24px}canvas{background:#56656b;max-width:100%}button,input{margin:8px}</style>
<h1>Dustwing - flight and action drafts</h1>
<p>Authored wing poses, fixed body scale. Review leg count, wing-root anatomy, pattern drift and loop continuity. Not bound to gameplay.</p>
<select id="clip"><option>flight</option><option>flight-left</option><option>flight-back</option><option>attack</option><option>hit</option><option>death</option></select><button id="pause">Pause</button><label>Frame <input id="frame" type="range" min="0" max="5" value="0"></label>
<canvas id="motion" width="600" height="520"></canvas>
<canvas id="contact" width="1200" height="800"></canvas>
<script type="module">
const image=new Image();image.src='./flight-front-v2.png';await image.decode();
const actions=new Image();actions.src='./actions-front.png';await actions.decode();
const leftFlight=new Image();leftFlight.src='./flight-left.png';await leftFlight.decode();
const leftActions=new Image();leftActions.src='./actions-left.png';await leftActions.decode();
const backFlight=new Image();backFlight.src='./flight-back.png';await backFlight.decode();
const backActions=new Image();backActions.src='./actions-back.png';await backActions.decode();
const backDeath=new Image();backDeath.src='./death-back-repair.png';await backDeath.decode();
let clip='flight';
const sequences={flight:[0,1,2,3,4,5],attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]};
for(const name of ['attack','hit','death']){sequences[`${name}-left`]=sequences[name];document.querySelector('#clip').add(new Option(`${name}-left`,`${name}-left`));}
for(const name of ['attack','hit','death']){sequences[`${name}-back`]=sequences[name];document.querySelector('#clip').add(new Option(`${name}-back`,`${name}-back`));}
const backActionCells=[[0,0,602,510,303,540],[602,0,445,510,225,540],[1047,0,489,510,250,540],[0,510,635,514,330,510],[600,560,445,464,220,410],[1047,600,489,424,250,340]];
const leftActionCells=[[0,0,512,580,180,620],[512,0,480,580,200,620],[992,0,544,580,180,620],[0,580,520,444,220,440],[520,580,450,444,220,420],[970,580,566,444,250,385]];
const actionCells=[[0,0,610,510,300,540],[610,0,440,512,215,540],[1050,0,486,550,240,540],[0,510,520,514,330,490],[520,550,510,474,255,450],[1030,600,506,424,175,325]];
// Sheet ignores the requested 512px grid. Use measured gaps, and register
// the thorax rather than changing each pose's scale to fit its silhouette.
const cells=[
 [0,0,560,512,290,300],[560,0,520,512,240,300],[1080,0,456,512,225,300],
 [0,512,548,512,285,250],[548,512,512,512,257,250],[1060,512,476,512,230,250]
];
function draw(ctx,f,x,y,s){
 if(clip==='flight-back'){
  const pose=[0,1,2,1,3,5][f],col=pose%3,cuts=pose<3?[0,582,1138,1536]:[0,576,1140,1536];
  const sx=cuts[col],w=cuts[col+1]-sx,sy=pose<3?0:512;
  const ax=[307,265,185,296,275,185][pose],ay=[280,280,280,220,240,190][pose];
  ctx.drawImage(backFlight,sx,sy,w,512,x-ax*s,y-ay*s,w*s,512*s);return;
 }
 if(clip==='flight-left'){
  const col=f%3,cuts=[0,512,1060,1536],sx=cuts[col],w=cuts[col+1]-sx;
  const sy=f<3?0:520,h=f<3?520:504;
  const ax=[220,190,200,210,190,190][f],ay=f<3?300:250;
  ctx.drawImage(leftFlight,sx,sy,w,h,x-ax*s,y-ay*s,w*s,h*s);return;
 }
 const pose=sequences[clip][f];
 if(clip.endsWith('-back')&&pose>=4){
  const sx=pose===4?0:670,w=pose===4?670:866,ax=pose===4?350:420,ay=pose===4?860:768;
  const k=s*.62;
  ctx.drawImage(backDeath,sx,0,w,1024,x-ax*k,y-ay*k,w*k,1024*k);return;
 }
 if(clip.endsWith('-back')){
  const [sx,sy,w,h,ax,ay]=backActionCells[pose];
  ctx.drawImage(backActions,sx,sy,w,h,x-ax*s,y-ay*s,w*s,h*s);return;
 }
 if(clip.endsWith('-left')){
  const [sx,sy,w,h,ax,ay]=leftActionCells[pose];
  ctx.drawImage(leftActions,sx,sy,w,h,x-ax*s,y-ay*s,w*s,h*s);return;
 }
 const [sx,sy,w,h,ax,ay]=(clip==='flight'?cells:actionCells)[pose];
 ctx.drawImage(clip==='flight'?image:actions,sx,sy,w,h,x-ax*s,y-ay*s,w*s,h*s);
}
const canvas=document.querySelector('#motion'),ctx=canvas.getContext('2d');
const sheet=document.querySelector('#contact'),cg=sheet.getContext('2d');
function contacts(){cg.clearRect(0,0,1200,800);for(let f=0;f<6;f++){draw(cg,f,f%3*400+200,Math.floor(f/3)*400+(clip.startsWith('flight')?220:370),clip.endsWith('-left')&&!clip.startsWith('flight')?.56:.65);cg.fillStyle='#fff';cg.fillText(`Frame ${f+1}`,f%3*400+12,Math.floor(f/3)*400+20);}
}
contacts();
let frame=0,paused=false,last=0;
document.querySelector('#clip').onchange=e=>{clip=e.target.value;frame=0;paused=false;contacts();};
document.querySelector('#pause').onclick=()=>{paused=!paused;};
document.querySelector('#frame').oninput=e=>{frame=Number(e.target.value);paused=true;};
function tick(now){
 if(!paused&&now-last>100){frame=clip.startsWith('flight')?(frame+1)%6:Math.min(5,frame+1);last=now;}
 ctx.clearRect(0,0,600,520);draw(ctx,frame,300,clip.startsWith('flight')?280:490,clip.endsWith('-left')&&!clip.startsWith('flight')?.75:.9);
 document.querySelector('#frame').value=frame;requestAnimationFrame(tick);
}
function exportDraft(){
 const previous=clip,images={},sizes={};
 const json={id:'dustwing_2d',kind:'sheet',facingMode:'directional',frame:{w:384,h:384},pivot:{x:192,y:346},pixelsPerCell:300,rows:['W','S','SW','NW','N'],mirror:{E:'W',SE:'W',NE:'W'},animations:{
 idle:{file:'idle.png',frames:6,fps:10,loop:true},walk:{file:'walk.png',frames:6,fps:12,loop:true,refMsPerCell:180},
 attack:{file:'attack.png',frames:6,fps:8,events:{hit:3}},hit:{file:'hit.png',frames:6,fps:12},death:{file:'death.png',frames:6,fps:8,hold:true}}};
 for(const [name,def]of Object.entries(json.animations)){
  const c=document.createElement('canvas');c.width=384*def.frames;c.height=384*json.rows.length;const ctx=c.getContext('2d');
  for(let row=0;row<json.rows.length;row++)for(let f=0;f<def.frames;f++){
   const suffix=row===1?'':row===4?'-back':'-left',flying=name==='idle'||name==='walk';
   clip=(flying?'flight':name)+suffix;
   ctx.save();ctx.translate(f*384,row*384);draw(ctx,f,192,flying?220:346,!flying&&suffix==='-left'?.43:.5);ctx.restore();
  }
  images[name]=c.toDataURL('image/png');sizes[name]={width:c.width,height:c.height};
 }
 clip=previous;return {json,images,sizes};
}
window.__monsterDraft={ready:true,exportDraft};
window.__dustwingFlight={ready:true,cells};requestAnimationFrame(tick);
</script>
