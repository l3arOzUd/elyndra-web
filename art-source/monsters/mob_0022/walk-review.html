<!doctype html><meta charset="utf-8"><title>Brine Automaton walk study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}button,input{margin:12px}a{color:#acf}</style>
<h1>Brine Automaton: front walk study</h1>
<p>Three drawings, four timing frames. Draft alternating lifts: feet visibly rise with bent knees. Support-foot drift, body registration and painted continuity remain unapproved.</p>
<button id="replay">Replay</button><input id="frame" type="range" min="0" max="3" value="0"><span id="label"></span><br><canvas id="preview" width="512" height="512"></canvas><canvas id="small" width="128" height="128"></canvas>
<p><a href="attack-review.html">Attack study</a> | <a href="death-review.html">Shutdown study</a> | <a href="idle-review.html">Idle study</a> | <a href="/">Game</a></p>
<script type="module">
const files=['front-neutral-v2.png','walk-front-right-lift.png','walk-front-left-lift.png'];
const urls=import.meta.glob('./{front-neutral-v2,walk-front-right-lift,walk-front-left-lift}.png',{eager:true,query:'?url',import:'default'});
const art=await Promise.all(files.map(src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=urls[`./${src}`]})));
const sequence=[0,1,0,2],g=preview.getContext('2d'),s=small.getContext('2d');let timer;
function draw(f){clearTimeout(timer);frame.value=f;label.textContent=`Frame ${f+1}: ${['neutral','right lift','left lift'][sequence[f]]}`;g.clearRect(0,0,512,512);g.drawImage(art[sequence[f]],0,0,512,512);s.clearRect(0,0,128,128);s.drawImage(preview,0,0,128,128)}
function play(f=0){draw(f);timer=setTimeout(()=>play((f+1)%4),220)}
replay.onclick=()=>play();frame.oninput=()=>draw(Number(frame.value));draw(0);window.__brineWalk={ready:true,draw,sequence};
</script>
