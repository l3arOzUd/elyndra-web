<!doctype html><meta charset="utf-8"><title>Glass Scarab front gait</title><style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style><h1>Glass Scarab front gait - draft</h1><p>Inspect six legs, alternating support and shell stability. Not approved for runtime.</p><button id="play">Play / pause</button><input id="frame" type="range" min="0" max="3" value="0"><br><canvas width="768" height="512"></canvas><br><img src="walk-front-v2.png" width="1200"><script type="module">const im=new Image();im.src='walk-front-v2.png';await im.decode();const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('#frame');let play=false,last=0;function draw(){const f=Number(slider.value),w=im.width/2,h=im.height/2;g.clearRect(0,0,768,512);g.drawImage(im,f%2*w,Math.floor(f/2)*h,w,h,0,0,768,512)}slider.oninput=()=>{play=false;draw()};document.querySelector('#play').onclick=()=>play=!play;function tick(t){if(play&&t-last>200){slider.value=(Number(slider.value)+1)%4;draw();last=t}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.__scarabFrontWalk={ready:true};</script>
