<!doctype html><meta charset="utf-8"><title>Glass Scarab front actions</title><style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style><h1>Glass Scarab front actions - draft</h1><p>Unapproved study. Inspect mandibles, six-leg anatomy and folded death silhouette.</p><select id="clip"><option>attack</option><option>hit</option><option>death</option></select><button id="play">Play / pause</button><input id="frame" type="range" min="0" max="5" value="0"><br><canvas width="640" height="640"></canvas><br><img src="actions-front.png" width="1200"><script type="module">const im=new Image();im.src='actions-front.png';await im.decode();const repair=new Image();repair.src='actions-front-v2.png';await repair.decode();const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('#frame'),clip=document.querySelector('#clip');const seq={attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]};let play=false,last=0;function draw(){const cell=seq[clip.value][Number(slider.value)],crops=[[0,0,520,540],[520,0,508,540],[1028,0,508,540],[0,540,534,484],[534,540,494,484],[1028,540,508,484]],anchors=[265,770,1285,265,770,1285],bottom=[505,505,527,987,963,963];const [sx,sy,w,h]=crops[cell],scale=1.05;g.clearRect(0,0,640,640);g.drawImage(cell===2?repair:im,sx,sy,w,h,320+(sx-anchors[cell])*scale,580+(sy-bottom[cell])*scale,w*scale,h*scale)}slider.oninput=()=>{play=false;draw()};clip.onchange=()=>{slider.value=0;draw()};document.querySelector('#play').onclick=()=>{if(Number(slider.value)===5)slider.value=0;play=!play;last=performance.now();draw()};function tick(t){if(play&&t-last>180){slider.value=Math.min(5,Number(slider.value)+1);draw();last=t;if(Number(slider.value)===5)play=false}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.__scarabFrontActions={ready:true};</script>
