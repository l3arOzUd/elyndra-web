<!doctype html><meta charset="utf-8"><title>Glass Scarab action study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style>
<h1>Glass Scarab action study - draft</h1><p>Isolated bite integrated. Ground alignment is approximate; anatomy and motion remain under review.</p>
<select id="clip"><option>attack</option><option>hit</option><option>death</option></select><button id="play">Play / pause</button><input id="frame" type="range" min="0" max="5" value="0"><span id="label"></span><br><canvas width="640" height="640"></canvas><br><img src="actions-left.png" width="1200">
<script type="module">
const im=new Image(),bite=new Image();im.src='actions-left.png';bite.src='bite-left-v2.png';await Promise.all([im.decode(),bite.decode()]);
const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('#frame'),clip=document.querySelector('#clip');
const seq={attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]};
const crops=[[0,0,520,512],[520,0,520,512],[1040,0,496,512],[0,512,534,512],[534,512,506,512],[1040,512,496,512]];
const anchors=[300,820,1335,315,825,1335],ground=[490,490,500,960,945,935];
function render(ctx,cell,x=340,y=570,scale=1){ctx.save();if(cell===2){const s=.4*scale;ctx.drawImage(bite,x-730*s,y-1080*s,bite.width*s,bite.height*s)}else{const [sx,sy,w,h]=crops[cell],s=.95*scale;if(cell===1){const dx=x+(sx-anchors[cell])*s,dy=y+(sy-ground[cell])*s;ctx.beginPath();ctx.moveTo(dx,dy);ctx.lineTo(dx+510*s,dy);ctx.lineTo(dx+510*s,dy+350*s);ctx.lineTo(dx+w*s,dy+350*s);ctx.lineTo(dx+w*s,dy+h*s);ctx.lineTo(dx,dy+h*s);ctx.closePath();ctx.clip()}ctx.drawImage(im,sx,sy,w,h,x+(sx-anchors[cell])*s,y+(sy-ground[cell])*s,w*s,h*s)}ctx.restore()}
let play=false,last=0;
function draw(){const f=Number(slider.value);g.clearRect(0,0,640,640);render(g,seq[clip.value][f]);g.strokeStyle='#a2b5b9';g.beginPath();g.moveTo(20,574);g.lineTo(620,574);g.stroke();document.querySelector('#label').textContent='Frame '+(f+1)+' / 6'}
slider.oninput=()=>{play=false;draw()};clip.onchange=()=>{slider.value=0;last=performance.now();draw()};document.querySelector('#play').onclick=()=>{if(Number(slider.value)===5)slider.value=0;play=!play;last=performance.now();draw()};
function tick(t){if(play&&t-last>180){slider.value=Math.min(5,Number(slider.value)+1);draw();last=t;if(Number(slider.value)===5)play=false}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
window.__scarabActions={ready:true,draw:(ctx,f,x,y,scale=1,action='attack')=>render(ctx,seq[action][Math.max(0,Math.min(5,f))],x,y,scale)};
</script>
