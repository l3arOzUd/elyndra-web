<!doctype html><meta charset="utf-8"><title>Glass Scarab action study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style>
<h1>Glass Scarab action study - draft</h1><p>Inspect anatomy, ground contact and shell registration. Not approved or bound to gameplay.</p>
<select id="clip"><option>attack</option><option>hit</option><option>death</option></select><button id="play">Play / pause</button><input id="frame" type="range" min="0" max="5" value="0"><span id="label"></span><br><canvas width="640" height="640"></canvas><br><img src="actions-left.png" width="1200">
<script type="module">
const im=new Image();im.src='actions-left.png';await im.decode();const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('#frame'),clip=document.querySelector('#clip');const seq={attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]};let play=false,last=0;function draw(){const f=Number(slider.value),cell=seq[clip.value][f],w=im.width/3,h=im.height/2;g.clearRect(0,0,640,640);const sx=cell===5?1040:cell%3*w,sw=cell===5?496:w;g.drawImage(im,sx,Math.floor(cell/3)*h,sw,h,cell===5?20:0,0,sw/w*640,640);document.querySelector('#label').textContent='Frame '+(f+1)+' / 6';}slider.oninput=()=>{play=false;draw()};clip.onchange=()=>{slider.value=0;draw()};document.querySelector('#play').onclick=()=>{if(Number(slider.value)===5)slider.value=0;play=!play};function tick(t){if(play&&t-last>180){slider.value=Math.min(5,Number(slider.value)+1);draw();last=t;if(Number(slider.value)===5)play=false}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.__scarabActions={ready:true};
</script>
