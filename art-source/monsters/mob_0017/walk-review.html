<!doctype html><meta charset="utf-8"><title>Glass Scarab gait study</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style>
<h1>Glass Scarab - tripod gait study</h1>
<p>Draft only. Inspect all six leg chains, supporting tripod, rigid shell and core stability.</p>
<button id="play">Play / pause</button><input id="frame" type="range" min="0" max="3" value="0"><span id="number"></span><br>
<canvas id="motion" width="800" height="550"></canvas><canvas id="sheet" width="1536" height="1024"></canvas>
<script type="module">
const im=new Image();im.src='walk-left-v2.png';await im.decode();
document.querySelector('#sheet').getContext('2d').drawImage(im,0,0,1536,1024);
const g=document.querySelector('#motion').getContext('2d');let playing=false,last=0,f=0;
function draw(){const w=im.width/2,h=im.height/2;g.clearRect(0,0,800,550);g.drawImage(im,f%2*w,Math.floor(f/2)*h,w,h,16,19,768,512);document.querySelector('#number').textContent=`${f+1} / 4`;}
document.querySelector('#play').onclick=()=>playing=!playing;
document.querySelector('#frame').oninput=e=>{playing=false;f=Number(e.target.value);draw();};
function tick(t){if(playing&&t-last>180){f=(f+1)%4;document.querySelector('#frame').value=f;draw();last=t;}requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);window.__glassScarabWalk={ready:true};
</script>
