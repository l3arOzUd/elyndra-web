<!doctype html>
<meta charset="utf-8">
<title>Brookfin walk draft</title>
<style>body{margin:24px;background:#263037;color:#eee;font:16px system-ui}canvas{background:#697a80;max-width:100%;display:block;margin:12px 0}button,input{margin:8px}</style>
<h1>Brookfin - fin-foot walk draft</h1>
<p>Inspect four limb attachments and near/far foot order. Frame 2 now lifts the near front foot; far rear support and attachment continuity still need review. Not approved or bound to gameplay.</p>
<select id="clip"><option>walk</option><option>idle</option><option>idle-front</option><option>walk-front</option><option>walk-back</option><option>attack</option><option>hit</option><option>death</option></select><button id="pause">Pause</button><label>Frame <input id="frame" type="range" min="0" max="5" value="0"></label>
<canvas id="motion" width="600" height="520"></canvas>
<canvas id="contact" width="1200" height="800"></canvas>
<script type="module">
const image=new Image();image.src='./walk-left.png';await image.decode();
const corrected=new Image();corrected.src='./walk-left-v2.png';await corrected.decode();
const actions=new Image();actions.src='./actions-left.png';await actions.decode();
const frontWalk=new Image();frontWalk.src='./walk-front.png';await frontWalk.decode();
const frontActions=new Image();frontActions.src='./actions-front.png';await frontActions.decode();
const correctedFrontActions=new Image();correctedFrontActions.src='./actions-front-v2.png';await correctedFrontActions.decode();
const backWalk=new Image();backWalk.src='./walk-back.png';await backWalk.decode();
const backActions=new Image();backActions.src='./actions-back.png';await backActions.decode();
const correctedBackActions=new Image();correctedBackActions.src='./actions-back-v2.png';await correctedBackActions.decode();
const blink=new Image();blink.src='./idle-left-blink.png';await blink.decode();
const frontBlink=new Image();frontBlink.src='./idle-front-blink-v2.png';await frontBlink.decode();
let clip='walk';
const seq={walk:[0,1,2,3,4,5],attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]};
for(const name of ['attack','hit','death']){seq[`${name}-front`]=seq[name];document.querySelector('#clip').add(new Option(`${name}-front`,`${name}-front`));}
for(const name of ['attack','hit','death']){seq[`${name}-back`]=seq[name];document.querySelector('#clip').add(new Option(`${name}-back`,`${name}-back`));}
const bottoms=[487,487,495,480,480,483];
function draw(ctx,f,x,y,s){
 if(clip==='idle-front'){ctx.drawImage(f===12?frontBlink:frontActions,0,0,512,530,x-256*s,y-512*s,512*s,530*s);return;}

 if(clip==='idle'){ctx.drawImage(f===12?blink:actions,0,0,526,550,x-256*s,y-530*s,526*s,550*s);return;}

 if(clip==='walk-back'){
  const sy=f<3?0:500,h=f<3?500:524,ax=[278,258,246,278,258,246][f];
  const bottom=f<3?480:482;
  ctx.drawImage(backWalk,f%3*512,sy,512,h,x-ax*s,y-bottom*s,512*s,h*s);return;
 }
 if(clip==='walk-front'){
  const cuts=[0,520,1024,1536],col=f%3,sx=cuts[col],w=cuts[col+1]-sx;
  const ax=[256,248,246,256,252,252][f],bottom=[502,502,510,482,483,488][f];
  ctx.drawImage(frontWalk,sx,Math.floor(f/3)*512,w,512,x-ax*s,y-bottom*s,w*s,512*s);return;
 }
 if(clip.endsWith('-back')){
  const pose=seq[clip][f],bottom=[504,502,495,440,441,419][pose];
  ctx.drawImage(pose===2||pose===5?correctedBackActions:backActions,pose%3*512,Math.floor(pose/3)*512,512,512,x-256*s,y-bottom*s,512*s,512*s);return;
 }
 if(clip.endsWith('-front')){
  const pose=seq[clip][f],sy=pose<3?0:530,h=pose<3?530:494;
  const bottom=[512,505,512,466,448,443][pose];
  ctx.drawImage(pose===1||pose===2?correctedFrontActions:frontActions,pose%3*512,sy,512,h,x-256*s,y-bottom*s,512*s,h*s);return;
 }
 if(clip!=='walk'){
  const pose=seq[clip][f],col=pose%3,cuts=pose<3?[0,526,996,1536]:[0,518,1014,1536];
  const sx=cuts[col],w=cuts[col+1]-sx,sy=pose<3?0:550,h=pose<3?550:474;
  const bottom=[530,520,515,424,414,416][pose];
  ctx.drawImage(actions,sx,sy,w,h,x-256*s,y-bottom*s,w*s,h*s);return;
 }
 ctx.drawImage(f===1?corrected:image,f%3*512,Math.floor(f/3)*512,512,512,x-256*s,y-bottoms[f]*s,512*s,512*s);
}
const ctx=document.querySelector('#motion').getContext('2d'),cg=document.querySelector('#contact').getContext('2d');
function contact(){cg.clearRect(0,0,1200,800);for(let i=0;i<6;i++){draw(cg,clip.startsWith('idle')?[0,4,8,11,12,15][i]:i,i%3*400+200,Math.floor(i/3)*400+370,.7);cg.fillStyle='#fff';cg.fillText(`Frame ${i+1}`,i%3*400+12,Math.floor(i/3)*400+20);}
}
contact();
let f=0,paused=false,last=0;
document.querySelector('#clip').onchange=e=>{clip=e.target.value;document.querySelector('#frame').max=clip.startsWith('idle')?15:5;f=0;paused=false;contact();};
document.querySelector('#pause').onclick=()=>{paused=!paused;};
document.querySelector('#frame').oninput=e=>{f=Number(e.target.value);paused=true;};
function tick(now){
 if(!paused&&now-last>150){f=clip.startsWith('idle')?(f+1)%16:clip.startsWith('walk')?(f+1)%6:Math.min(5,f+1);last=now;}
 ctx.clearRect(0,0,600,520);draw(ctx,f,300,490,.9);
 document.querySelector('#frame').value=f;requestAnimationFrame(tick);
}
function exportDraft(){
 const previous=clip,images={},sizes={};
 const json={id:'brookfin_2d',kind:'sheet',facingMode:'directional',frame:{w:384,h:384},pivot:{x:192,y:346},pixelsPerCell:300,rows:['W','S','SW','NW','N'],mirror:{E:'W',SE:'W',NE:'W'},animations:{idle:{file:'idle.png',frames:16,fps:8,loop:true},walk:{file:'walk.png',frames:6,fps:8,loop:true,refMsPerCell:240},attack:{file:'attack.png',frames:6,fps:8,events:{hit:3}},hit:{file:'hit.png',frames:6,fps:12},death:{file:'death.png',frames:6,fps:8,hold:true}}};
 for(const [name,def]of Object.entries(json.animations)){
  const c=document.createElement('canvas');c.width=384*def.frames;c.height=384*json.rows.length;const ctx=c.getContext('2d');
  for(let row=0;row<json.rows.length;row++)for(let f=0;f<def.frames;f++){
   const suffix=row===1?'-front':row===4?'-back':'';
   clip=(name==='idle'&&suffix==='-back'?'attack':name)+suffix;
   ctx.save();ctx.translate(f*384,row*384);draw(ctx,name==='idle'&&suffix==='-back'?0:f,192,346,.60);ctx.restore();
  }
  images[name]=c.toDataURL('image/png');sizes[name]={width:c.width,height:c.height};
 }
 clip=previous;return {json,images,sizes};
}
window.__monsterDraft={ready:true,exportDraft};
window.__brookfinWalk={ready:true};requestAnimationFrame(tick);
</script>
