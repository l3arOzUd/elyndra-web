<!doctype html><meta charset="utf-8"><title>Sapdrone action draft</title>
<style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;display:block;max-width:100%;margin:16px 0}</style>
<h1>Sapdrone ? left action draft</h1><p>Needle attack, hit and grounded collapse. Anatomy and transition poses remain under review; not bound to gameplay.</p>
<select id="clip"><option>attack</option><option>hit</option><option>death</option></select><button id="replay">Replay</button><input id="frame" type="range" min="0" max="5" value="0">
<canvas id="motion" width="640" height="560"></canvas><canvas id="contact" width="1200" height="800"></canvas>
<script type="module">
const im=new Image();im.src='./actions-left.png';await im.decode();let clip='attack',f=0,paused=false,last=0;
const seq={attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]};
function draw(ctx,f,x,y,s){const p=seq[clip][f],sx=[0,512,970,0,520,984][p],sy=p<3?0:512,w=[512,508,566,512,460,552][p],bottom=[484,462,455,425,435,432][p],ax=[256,256,310,256,248,296][p];ctx.save();if(p===2){ctx.beginPath();ctx.rect(x-ax*s,y-(bottom-300)*s,w*s,212*s);ctx.rect(x-(ax-50)*s,y-bottom*s,(w-50)*s,300*s);ctx.clip();}ctx.drawImage(im,sx,sy,w,512,x-ax*s,y-bottom*s,w*s,512*s);ctx.restore();}
const ctx=document.querySelector('#motion').getContext('2d'),cg=document.querySelector('#contact').getContext('2d');function contact(){cg.clearRect(0,0,1200,800);for(let i=0;i<6;i++)draw(cg,i,i%3*400+200,Math.floor(i/3)*400+370,.65);}contact();
document.querySelector('#clip').onchange=e=>{clip=e.target.value;f=0;paused=false;contact();};document.querySelector('#replay').onclick=()=>{f=0;paused=false;};document.querySelector('#frame').oninput=e=>{f=Number(e.target.value);paused=true;};
function tick(t){if(!paused&&t-last>140){f=Math.min(5,f+1);last=t;}ctx.clearRect(0,0,640,560);draw(ctx,f,320,510,.8);document.querySelector('#frame').value=f;requestAnimationFrame(tick);}window.__sapdroneActions={ready:true};requestAnimationFrame(tick);
</script>
