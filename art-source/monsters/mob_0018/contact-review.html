<!doctype html><meta charset="utf-8"><title>Scarab rear support contacts</title><style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style><h1>Dune Sentry opposite contacts - draft</h1><p>Two contacts and first passing pose. Inspect near/far limb identity, rigid block lengths and weight transfer.</p><select id="pose"><option value="0">Contact A</option><option value="1">Passing A</option><option value="2">Contact B</option></select><button id="play">Alternate / pause</button><br><canvas width="800" height="800"></canvas><script type="module">const images=[];for(const file of ['walk-left-contact-a-v5.png','walk-left-pass-a.png','walk-left-contact-b.png']){const im=new Image();im.src=file;await im.decode();images.push(im)}const c=document.querySelector('canvas'),g=c.getContext('2d'),select=document.querySelector('#pose');let play=false,last=0;function draw(){g.clearRect(0,0,800,800);g.drawImage(images[Number(select.value)],0,0,800,800)}select.onchange=draw;document.querySelector('#play').onclick=()=>play=!play;function tick(t){if(play&&t-last>350){select.value=(Number(select.value)+1)%3;draw();last=t}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.__duneContacts={ready:true};</script>
