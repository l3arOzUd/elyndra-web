<!doctype html><meta charset="utf-8"><title>Dune Sentry walk study</title><style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style><h1>Dune Sentry - heavy walk study</h1><p>Draft: inspect rigid blocks, two legs, two fists, planted feet and weight transfer.</p><button id="play">Play / pause</button><input id="frame" type="range" min="0" max="5" value="0"><br><canvas width="640" height="640"></canvas><br><img src="walk-left-v2.png" width="1200"><script type="module">const im=new Image();im.src='walk-left-v2.png';await im.decode();const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('#frame');let play=false,last=0;function draw(){const f=Number(slider.value),w=im.width/3,h=im.height/2;g.clearRect(0,0,640,640);g.drawImage(im,f%3*w,Math.floor(f/3)*h,w,h,0,0,640,640)}slider.oninput=()=>{play=false;draw()};document.querySelector('#play').onclick=()=>play=!play;function tick(t){if(play&&t-last>240){slider.value=(Number(slider.value)+1)%6;draw();last=t}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.__duneWalk={ready:true};</script>
