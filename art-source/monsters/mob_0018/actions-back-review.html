<!doctype html><meta charset="utf-8"><title>Dune Sentry rear actions</title><style>body{background:#263037;color:#eee;font:16px system-ui;margin:24px}canvas{background:#697a80;max-width:100%}</style><h1>Dune Sentry action study - draft</h1><p>Inspect shoulder connections, rigid blocks, fist reach and forward collapse. Not runtime bound.</p><select id="clip"><option>attack</option><option>hit</option><option>death</option></select><label><input id="repair" type="checkbox" checked>Use revised punch</label><button id="play">Play / pause</button><input id="frame" type="range" min="0" max="5" value="0"><br><canvas width="640" height="640"></canvas><br><img src="actions-back.png" width="1200"><script type="module">const im=new Image();im.src='actions-back.png';await im.decode();const repaired=new Image();repaired.src='actions-back-v2.png';await repaired.decode();const repair=document.querySelector('#repair');const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('#frame'),clip=document.querySelector('#clip');const seq={attack:[0,1,1,2,2,0],hit:[0,3,3,0,0,0],death:[0,4,4,5,5,5]},crops=[[0,0,512,525],[512,0,512,525],[1024,0,512,525],[0,525,530,499],[530,525,494,499],[1024,525,512,499]],anchors=[255,775,1290,280,770,1290],ground=[511,511,511,993,977,982];let play=false,last=0;function draw(){const cell=seq[clip.value][Number(slider.value)],[sx,sy,w,h]=crops[cell],s=.9;g.clearRect(0,0,640,640);g.drawImage(cell===2&&repair.checked?repaired:im,sx,sy,w,h,320+(sx-anchors[cell])*s,590+(sy-ground[cell])*s,w*s,h*s);g.strokeStyle='#a8b6b9';g.beginPath();g.moveTo(10,590);g.lineTo(630,590);g.stroke()}repair.onchange=draw;slider.oninput=()=>{play=false;draw()};clip.onchange=()=>{slider.value=0;draw()};document.querySelector('#play').onclick=()=>{if(Number(slider.value)===5)slider.value=0;play=!play;last=performance.now();draw()};function tick(t){if(play&&t-last>220){slider.value=Math.min(5,Number(slider.value)+1);draw();last=t;if(Number(slider.value)===5)play=false}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);window.__duneActions={ready:true};</script>
