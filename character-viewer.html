<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayfarer Character Viewer</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; --bg: #1c2128; --panel: #262d36; --line: #3a4552; --text: #e7ecf2; --muted: #9aa7b6; --accent: #e3c27a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 18px; color: var(--accent); }
    header p { margin: 0; color: var(--muted); }
    main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    aside, section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    h2 { font-size: 14px; margin: 12px 0 6px; color: var(--accent); }
    h2:first-child { margin-top: 0; }
    label { display: block; cursor: pointer; }
    select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
    button { cursor: pointer; width: 100%; margin-top: 6px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .cells { display: flex; gap: 8px; flex-wrap: wrap; }
    figure { margin: 0; text-align: center; }
    figcaption { color: var(--muted); font-size: 12px; }
    canvas { background: repeating-conic-gradient(#2c343e 0 25%, #323b46 0 50%) 0 0 / 16px 16px; border-radius: 6px; display: block; }
    #missing { color: #f0a070; font-size: 12px; white-space: pre-wrap; }
    #missing.ok { color: #8fd18f; }
  </style>
</head>
<body>
  <header>
    <h1>Wayfarer Character Viewer</h1>
    <p>วางไฟล์ PNG ใน <code>public/sprites/wayfarer/</code> แล้วกด "โหลดภาพใหม่" · หลักการวาดดู CHARACTER_ART_GUIDE.md</p>
  </header>
  <main>
    <aside>
      <h2>อุปกรณ์</h2>
      <div id="slots"></div>
      <h2>ท่า</h2>
      <select id="anim"></select>
      <label><input type="checkbox" id="slow" /> เล่นช้า ×0.25</label>
      <label><input type="checkbox" id="pivots" checked /> แสดงจุดหมุน (ท่ายืน)</label>
      <button id="reload">โหลดภาพใหม่</button>
      <h2>ไฟล์ที่ยังไม่มี</h2>
      <div id="missing"></div>
    </aside>
    <section>
      <h2>เคลื่อนไหว 5 ทิศ (อีก 3 ทิศเกมกลับด้านให้)</h2>
      <div class="cells" id="anim-cells"></div>
      <h2>ท่ายืนแยกมุม (ขนาดผืนวาดจริง 512×512 ย่อครึ่ง)</h2>
      <div class="cells" id="rest-cells"></div>
    </section>
  </main>
  <script type="module" src="/src/tools/characterViewer.ts"></script>
</body>
</html>
